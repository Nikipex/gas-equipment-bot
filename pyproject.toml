[project]
name = "gas-equipment-bot"
version = "0.1.0"
description = "Telegram-бот для поиска и подбора газового оборудования"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "pydantic-settings>=2.7,<3",
    "loguru>=0.7,<1",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "aiohttp>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
